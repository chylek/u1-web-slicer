[project]
name = "u1-web-slicer"
version = "0.2.1"
description = "Phone-first web slicer for the Snapmaker U1, driving the Snapmaker Orca CLI"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL"]
ignore = [
  "E731",    # lambda assignments: used deliberately for tiny local helpers
  "PLR0912", "PLR0913", "PLR0915", "PLR0911", "PLR2004", "PLR1714", "PLW2901", "PLR0914", "PLR0917", "PLR1702", "PLR6301", "PLC0415",
  "B023",    # closures in loops are bound immediately
  "B905",    # zip(strict=) everywhere is noise; lengths are checked where they matter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
