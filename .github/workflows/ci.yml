name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff format --check . && uvx ruff check .
      - run: uv run --no-project --with pillow --with pytest pytest
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund && npm run fmt:check && npm run lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # whole history on every run: the action's push-range mode breaks on first pushes and force pushes
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --redact
