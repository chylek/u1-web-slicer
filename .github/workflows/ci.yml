name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:   # manual run = gitleaks scans the whole history
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff format --check . && uvx ruff check .
      - run: uv run --no-project --with pillow --with pytest pytest
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund && npm run fmt:check && npm run lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
